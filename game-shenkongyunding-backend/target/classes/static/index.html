<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>深空云顶官网</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #f5f0ff; color: #3a3460;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .splash { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
            background: linear-gradient(170deg,#9ed8ff 0%,#c8b6ff 50%,#ffd6f0 100%); }
        .splash h1 { font-size: 48px; letter-spacing: 12px; color: #3a3460; margin: 0; }
        .splash p { color: #6a6090; letter-spacing: 4px; margin: 0; }
        .splash a { color: #3a3460; text-decoration: none; border: 1px solid #c8b6ff; background: #c8b6ff; padding: 10px 24px; border-radius: 4px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="splash">
        <h1>深空云顶</h1>
        <p>SKYLAND OF DEEP SPACE</p>
        <p>后端服务运行中，请启动前端以访问完整站点</p>
        <a href="/api/game">查看作品 API</a>
    </div>
</body>
</html>
